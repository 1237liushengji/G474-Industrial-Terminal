# mosquitto.conf - project broker profile (docs/05 v0.5)
#
# The docs reference "Mosquitto 2.1.2, E:\Edge\mosquitto-2.1.2" - that is the
# SOURCE tree; a broker binary must be built or installed first (see
# mqtt_topics.md, section "broker bring-up").  Once a mosquitto.exe exists:
#
#   mosquitto.exe -c Tools/mqtt/mosquitto.conf -v
#
# QoS1 persistence requires `persistence true` (docs/03 §5.3, clean session
# false on the device side from v0.6 on).

listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location ./data/

log_dest stdout
log_type error
log_type warning
log_type notice
